                    // --- Fonction de validation de date (jj/mm/aa) ---
                    function isValidDate(dateString) {
                        // Expression régulière pour format jj/mm/aa (2 chiffres / 2 chiffres / 2 chiffres)
                        const regex = /^(0[1-9]|[12][0-9]|3[01])\/(0[1-9]|1[012])\/(\d{2})$/; 
                        
                        if (!regex.test(dateString)) return false; // Si le format ne correspond pas, erreur
                        
                        const parts = dateString.split('/'); // Sépare jour, mois, année
                        const day = parseInt(parts[0], 10); // Convertit jour en entier
                        const month = parseInt(parts[1], 10); // Convertit mois en entier
                        const year = parseInt('20' + parts[2], 10); // Convertit année (ajoute 20xx)
                        
                        // Crée un objet Date pour vérifier la validité réelle (ex: 30 février)
                        const dateObj = new Date(year, month - 1, day); // Mois commence à 0 en JS
                        
                        // Vérifie si la date créée correspond aux valeurs entrées
                        return dateObj.getFullYear() === year && 
                            dateObj.getMonth() === (month - 1) && 
                            dateObj.getDate() === day;
                    }
                // =============================================
                // 08. Fonction principale de création du voyage
                // =============================================
                    async function createTrip() {
                        // --- SÉCURITÉ : Vérifier que le bouton est bien en mode création ---
                        const btn = document.querySelector('.btn-create-trip');
                        if (btn && btn.dataset.mode === 'update') {
                            console.warn("Erreur : createTrip appelé en mode update. Annulation.");
                            return; // Arrête tout si on est en mode modification
                        }
                        // ---------------------------------------------------------------
                        // 1. Récupération des valeurs
                        // Récupération de la valeur complète (ex: "France|🇫🇷")
                            const countryValue = document.getElementById('trip-country').value;
                            // Séparation du nom et du drapeau
                            const countryParts = countryValue.split('|'); 
                            const countryName = countryParts[0]; // Prend la partie avant le | (ex: "France")
                            const countryFlag = countryParts[1] || ''; // Prend la partie après le | (ex: "🇫🇷") ou vide si erreur
                            const name = document.getElementById('trip-name').value.trim();
                            const countrySelect = document.getElementById('trip-country');

                            // --- Début gestion du format de stockage des dates ---
                                // Récupération brute (ex: "15/07/26")
                                const rawDateStart = document.getElementById('trip-date-start').value.trim();
                                const rawDateEnd = document.getElementById('trip-date-end').value.trim();

                                // Fonction de conversion locale vers ISO (YYYY-MM-DD)
                                function toISODate(ddmmyy) {
                                    if (!ddmmyy) return null;
                                    const parts = ddmmyy.split('/');
                                    if (parts.length !== 3) return null;
                                    // parts[0]=Jour, parts[1]=Mois, parts[2]=Année (2 chiffres)
                                    return `20${parts[2]}-${parts[1]}-${parts[0]}`;
                                }

                                // Conversion immédiate
                                const dateStart = toISODate(rawDateStart); 
                                const dateEnd = toISODate(rawDateEnd);
                                // --- Début gestion du format de stockage des date ---
                        
                        // 2. Validations
                            if (!name || !/^[A-Za-zÀ-ÿ\s]+$/.test(name)) { alert("Le nom du voyage ne doit contenir que des lettres."); return; }
                            if (!dateStart || !dateEnd) { alert("Veuillez sélectionner une date de début et une fin."); return; } // Bloque si une date manque
                            if (!countryName) { alert("Veuillez sélectionner un pays."); return; }
                            if (!currentImageBase64) { alert("Veuillez sélectionner une image."); return; }

                        // 3. Calcul dynamique de la durée
                            const dStart = new Date(dateStart); // Convertit la chaîne de début en objet Date
                            const dEnd = new Date(dateEnd); // Convertit la chaîne de fin en objet Date
                            if (dEnd <= dStart) { alert("La date de fin doit être strictement postérieure à la date de début."); return; } // Vérifie la cohérence logique des dates
                            const diffTime = Math.abs(dEnd - dStart); // Calcule la différence en millisecondes
                            const durationDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; // Calcule le nombre de jours inclusifs (dynamique)

                        // 4. Création de l'objet voyage (PAS d'id : c'est le serveur qui l'attribue,
                        //    pour éviter toute collision entre plusieurs appareils/utilisateurs)
                            const newTripPayload = {
                                name: name,
                                dateStart: dateStart,
                                dateEnd: dateEnd,
                                country: countryName,
                                flag: countryFlag,
                                image: currentImageBase64,
                                duration: durationDays // Stocke la durée calculée pour usage futur
                            };

                        // 5. ENVOI AU CLOUD (remplace la sauvegarde localStorage)
                            let createdTrip;
                            try {
                                createdTrip = await apiRequest('POST', '/trips', newTripPayload); // Le serveur renvoie le voyage complet, avec son id
                            } catch (e) {
                                alert("La création du voyage a échoué (connexion au serveur impossible).");
                                return;
                            }
                            cloudTrips.push(createdTrip); // Met à jour le cache mémoire

                        // 6. Affichage immédiat via la fonction de rendu dédiée
                            renderTripCard(createdTrip); // Appelle la fonction qui crée le HTML et les boutons "Jour"
                        
                        // 7. Nettoyage du formulaire
                            closeAddTripModal(); // Ferme la fenêtre modale et réinitialise les champs
                    }

                // ======================================================
                // 09. Fonction pour générer et afficher une carte voyage
                // ======================================================
                    function renderTripCard(trip) {
                        // 1. Sélection du conteneur et préparation
                        const grid = document.getElementById('trips-grid'); // Récupère la grille principale des voyages
                        const btnNewTrip = document.querySelector('.btn-new-trip'); // Récupère le bouton "New Trip" pour l'insertion

                        newCard.className = 'trip-card'; // Applique la classe CSS principale
                        newCard.dataset.tripId = trip.id; // Définit l'ID unique en attribut data (ex: data-trip-id="123456")
                        newCard.dataset.diffTime = trip.duration; // Stocke la durée dynamique (ex: data-diff-time="5")

                        // 2. Gestion du clic sur la carte (Navigation vs Édition)
                        newCard.onclick = function(e) { // Ajout de 'e' pour l'événement
                            // Empêche le clic sur la carte de déclencher l'ouverture si on clique sur un bouton interne (ex: futur bouton Orga)

                            if (pendingAction) { 
                                selectTrip(newCard, trip.id); // Si une action est en cours, délègue à selectTrip
                            } else { 
                                openTripHome(trip.id); // Sinon, ouvre l'écran d'accueil du voyage (trip-home-screen)
                            }
                        };

                        // Conversion des dates ISO (YYYY-MM-DD) vers format affichage (JJ/MM/AAAA)
                        const displayStart = trip.dateStart.split('-').reverse().join('/'); 
                        const displayEnd = trip.dateEnd.split('-').reverse().join('/');
                        // ---------------------------------------------------

                        // 3. Injection du contenu HTML
                        newCard.innerHTML = `
                            <div class="trip-image-container">
                                <img src="${trip.image}" alt="${trip.name}">
                            </div>
                            <div class="trip-details">
                                <div class="trip-title">${trip.name}</div>
                                <div class="trip-dates">

                                </div>
                                <div class="trip-country">
                                    <span>${trip.country}</span>

                                </div>

                        // Insère la carte avant le bouton "New Trip"
                        grid.insertBefore(newCard, btnNewTrip);
                    }   

                // ==============================================================

                // =========================================================
                // 11. Fonctions pour modifier/supprimer une carte de voyage
                // =========================================================
                    let pendingAction = null; // Stocke l'action en attente ('edit' ou 'delete')
                    let selectedTripCard = null; // Stocke la carte sélectionnée
                    let selectedTripId = null;   // Stocke l'ID
                    // --- a. Ouverture du menu et choix de l'action ---

                        const isClosing = menu.classList.contains('active');

                    // --- b. Préparation de l'action (après clic sur Modifier/Supprimer) ---

                    // --- c. Gestion du clic sur une carte (Sélection) ---
                    function selectTrip(cardElement, tripId) {

                        if (!pendingAction) {

                            return;

                        // Exécution de l'action mémorisée
                        if (pendingAction === 'edit') {

                        } else if (pendingAction === 'delete') {
                            executeDelete(cardElement, tripId);
                        }

                        resetSelectionState();
                    }
                    // --- d. Exécution : Modifier ---
                    function executeEdit(tripId, tripName) {
                        const tripToEdit = cloudTrips.find(t => t.id === tripId);

                        if (tripToEdit) {
                            // 1. Ouvrir la modale (Remet le bouton en mode "create" temporairement)
                            openAddTripModal();

                            // Fonction utilitaire : Convertit "2026-07-15" en "15/07/26"
                            function toShortDate(isoDate) {
                                if (!isoDate) return "";
                                // Vérifie si c'est déjà un format court (jj/mm/aa) pour éviter de reconvertir
                                if (isoDate.includes('/')) return isoDate; 
                                
                                const d = new Date(isoDate);
                                if (isNaN(d.getTime())) return ""; // Retourne vide si la date est invalide

                                // Utilisation de getUTC pour éviter les décalages de fuseau horaire
                                const day = String(d.getUTCDate()).padStart(2, '0');
                                const month = String(d.getUTCMonth() + 1).padStart(2, '0');
                                const year = String(d.getUTCFullYear()).slice(-2);
                                return `${day}/${month}/${year}`;
                            }
                            
                            // Application aux deux champs
                            const startDate = tripToEdit.dateStart;
                            const endDate = tripToEdit.dateEnd;

                            // 1. Remplir les champs Date
                            document.getElementById('trip-date-start').value = toShortDate(startDate);
                            document.getElementById('trip-date-end').value = toShortDate(endDate);

                            // Debug : Si endDate est NaN, affichez la valeur brute dans la console
                            if (!endDate || isNaN(new Date(endDate).getTime())) {
                                console.error("Date de fin invalide dans la BDD :", endDate);
                            }

                            // 2. Remplir le champ Name
                            document.getElementById('trip-name').value = tripToEdit.name;
                            
                            const countrySelect = document.getElementById('trip-country');
                            for (let i = 0; i < countrySelect.options.length; i++) {
                                if (countrySelect.options[i].value.startsWith(tripToEdit.country + '|')) {
                                    countrySelect.selectedIndex = i;
                                    break;
                                }
                            }
                            
                            if (tripToEdit.image) {
                                const imgPreview = document.getElementById('image-preview');
                                const placeholder = document.getElementById('image-placeholder');
                                imgPreview.src = tripToEdit.image;
                                imgPreview.style.display = 'block';
                                placeholder.style.display = 'none';
                                currentImageBase64 = tripToEdit.image;
                            }

                            // 3. BASCULER EN MODE UPDATE (APRÈS un délai)
                            // C'est cette étape qui écrase la configuration par défaut de openAddTripModal
                            setTimeout(() => {
                                const createBtn = document.querySelector('.btn-create-trip');
                                const modalTitle = document.querySelector('.modal-add-title');
                                // Mettre à jour le texte du titre avec le nom du voyage

                                    // Optionnel : Log pour déboguer

                                }
                            }, 20); // 20ms de délai pour garantir que le DOM est à jour
                        }
                    }                    // --- e. Exécution : Supprimer ---
                    async function executeDelete(cardElement, tripId) {
                        if (confirm("Êtes-vous sûr de vouloir supprimer ce voyage ?")) {
                            try {
                                await apiRequest('DELETE', `/trips/${tripId}`);
                            } catch (e) {
                                alert("La suppression a échoué (connexion au serveur impossible).");

                            }

                    }
                    // --- f. Fonction de Mise à Jour (appelée par le bouton "Mettre à jour") ---
                    async function updateTrip(tripId) {
                        // 1. Récupération des valeurs (Inchangé)
                        const name = document.getElementById('trip-name').value.trim();
                        const dateStart = document.getElementById('trip-date-start').value.trim();
                        const dateEnd = document.getElementById('trip-date-end').value.trim();
                        const budgetInput = document.getElementById('finance-budget-input');
                        const expensesInput = document.getElementById('finance-expenses-input');
                        const tricountInput = document.getElementById('tricount-url');
                        // On lit les valeurs SEULEMENT si les inputs existent, sinon on garde 0 ou vide
                        let currentBudget = budgetInput ? (parseFloat(budgetInput.value) || 0) : 0;
                        let currentExpenses = expensesInput ? (parseFloat(expensesInput.value) || 0) : 0;
                        let currentTricountUrl = tricountInput ? tricountInput.value.trim() : '';
                        if (budgetInput) currentBudget = parseFloat(budgetInput.value) || 0;
                        if (expensesInput) currentExpenses = parseFloat(expensesInput.value) || 0;
                        if (tricountInput) currentTricountUrl = tricountInput.value.trim();
                        //---------------------------------------------------
                        const countrySelect = document.getElementById('trip-country');
                        const countryValue = countrySelect.value;
                        const countryParts = countryValue.split('|');
                        const countryName = countryParts[0];
                        const countryFlag = countryParts[1] || '';

                        // 2. Validations
                        if (!name || !/^[A-Za-zÀ-ÿ\s]+$/.test(name)) { alert("Nom invalide."); return; }
                        if (!isValidDate(dateStart)) { alert("Date début invalide."); return; }
                        if (!isValidDate(dateEnd)) { alert("Date fin invalide."); return; }

                        // 3. Calcul de la durée
                        // Fonction utilitaire pour convertir "15/07/26" en "2026-07-15"
                        function toISODate(ddmmyy) {
                            if (!ddmmyy) return null;
                            const parts = ddmmyy.split('/');
                            if (parts.length !== 3) return null;
                            // parts[0]=Jour, parts[1]=Mois, parts[2]=Année (2 chiffres)
                            const year = parseInt(parts[2]) > 50 ? `19${parts[2]}` : `20${parts[2]}`; // Gestion siècle (optionnel)
                            return `${year}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
                        }
                        const isoStart = toISODate(dateStart);
                        const isoEnd = toISODate(dateEnd);
                        if (!isoStart || !isoEnd) {
                            alert("Format de date incorrect.");
                            return;
                        }
                        const dStart = new Date(isoStart);
                        const dEnd = new Date(isoEnd);
                        const durationDays = Math.ceil(Math.abs(dEnd - dStart) / (1000 * 60 * 60 * 24)) + 1;

                        // 4. Mise à jour via l'API cloud (remplace le LocalStorage)
                        // NB : on garde tripId tel quel (pas de Number() forcé) car un id
                        // généré côté serveur n'est pas forcément numérique (UUID, etc.)
                        const tripIndex = cloudTrips.findIndex(t => t.id == tripId);

                        if (tripIndex !== -1) {
                            const updatedTripPayload = {
                                name: name,
                                dateStart: dateStart,
                                dateEnd: dateEnd,
                                country: countryName,
                                flag: countryFlag,
                                image: currentImageBase64,
                                duration: durationDays,
                                budget: currentBudget,
                                expenses: currentExpenses,
                                tricountUrl: currentTricountUrl
                            };

                            let updatedTrip;
                            try {
                                updatedTrip = await apiRequest('PUT', `/trips/${tripId}`, updatedTripPayload);
                            } catch (e) {
                                alert("La mise à jour a échoué (connexion au serveur impossible).");
                                return;
                            }
                            cloudTrips[tripIndex] = updatedTrip; // Remplace par la version confirmée par le serveur
                            
                            // 5. Mise à jour du DOM
                            const cardToUpdate = document.querySelector(`.trip-card[data-trip-id="${tripId}"]`);
                            
                            if (cardToUpdate) {
                                cardToUpdate.dataset.diffTime = durationDays;
                                cardToUpdate.querySelector('.trip-title').textContent = name;
                                cardToUpdate.querySelector('.trip-dates').innerHTML = `<span>${dateStart}</span><span> – </span><span>${dateEnd}</span>`;
                                cardToUpdate.querySelector('.trip-country').innerHTML = `<span>${countryName}</span><span>${countryFlag}</span>`;
                                
                                const img = cardToUpdate.querySelector('img');
                                if (img && currentImageBase64) img.src = currentImageBase64;
                            }

                            // 6. Fermeture et reset
                            closeAddTripModal();
                            resetSelectionState(); 
                        } else {
                            console.error("ID recherché :", tripId);
                            console.error("IDs en cache :", cloudTrips.map(t => t.id));
                            alert("Erreur : Voyage introuvable.");
                        }
                    }

                    // --- Utilitaires ---
                    function closeOptionsMenu() {
                        document.getElementById('options-menu').classList.remove('active');
                        document.getElementById('options-overlay').classList.remove('active');
                    }
                    function resetSelectionState() {
                        pendingAction = null;
                        selectedTripCard = null;
                        selectedTripId = null;
                        document.body.classList.remove('waiting-for-selection');
                        document.querySelector('.btn-hamburger').style.pointerEvents = 'auto';
                        // Retirer le message
                        const toast = document.querySelector('.instruction-toast');
                        if (toast) toast.remove();
                    }
                    function showToast(message) {
                        // Retirer ancien message s'il existe
                        const oldToast = document.querySelector('.instruction-toast');
                        if (oldToast) oldToast.remove();
                        
                        const toast = document.createElement('div');
                        toast.className = 'instruction-toast';
                        toast.innerText = message;
                        document.body.appendChild(toast);

                        setTimeout(() => {

                // ==============================================
                // 12. Logique du bouton retour dans le dashboard
                // ==============================================

                        const dashboard = document.getElementById('dashboard-screen');

                            // Recharger la page pour un état "neuf"

                                location.reload();

                    }
                // ============================
                // 13. Logique des formats date
                // ============================
                    function formatDate(input) {
                        // 1. On récupère la valeur et on ne garde QUE les chiffres
                        let value = input.value.replace(/\D/g, ''); // \D signifie "tout ce qui n'est pas un chiffre"
                        // 2. On limite à 6 chiffres (pour jj/mm/aa)
                        if (value.length > 6) {
                            value = value.substring(0, 6);
                        }
                        // 3. On reconstruit le format avec les slashes
                        let formattedValue = '';
                        if (value.length >= 2) {
                            formattedValue += value.substring(0, 2) + '/'; // JJ/
                        } else {
                            formattedValue += value;
                        }
                        
                        if (value.length >= 4) {
                            formattedValue += value.substring(2, 4) + '/'; // MM/
                            formattedValue += value.substring(4, 6);       // AA
                        } else if (value.length > 2) {
                            formattedValue += value.substring(2, 4);       // MM (si entre 2 et 4 chiffres)
                        }
                        // 4. On met à jour la valeur du champ
                        input.value = formattedValue;
                    }
            // ==========================================
            // FONCTIONS DE L'ECRAN D'ACCUEIL DES VOYAGES
            // ==========================================
                let currentTripId = null; // Variable globale pour stocker l'ID du voyage en cours de consultation
                // ===============================================================
                // 01. Fonctions pour ouvrir et compléter l'écran d'accueil voyage
                // ===============================================================
                    async function openTripHome(tripId) {
                        currentTripId = tripId; // Stocke l'ID du voyage cliqué dans la variable globale
                        const trip = cloudTrips.find(t => t.id === tripId); // Trouve le voyage correspondant à l'ID dans le cache mémoire

                        if (!trip) return; // Si le voyage n'existe pas, on arrête la fonction

                        // Charge les données jour-par-jour de CE voyage depuis le cloud AVANT
                        // tout ce qui en dépend (compteur de logements, ouverture d'un jour,
                        // récap...). getTripData()/saveDayData() restent ensuite synchrones.
                        await loadTripDataCache(tripId);

                        // ===================
                        // a. Remplir le titre
                        // ===================
                                document.getElementById('trip-home-title').innerText = trip.name; // Insère le nom du voyage dans le titre h3

                        // ==========
                        // b. Calculs
                        // ==========
                                // Dates
                                const startParts = trip.dateStart.split('/'); // Sépare la date de début (jj/mm/aa) en tableau [jj, mm, aa]
                                const endParts = trip.dateEnd.split('/'); // Sépare la date de fin (jj/mm/aa) en tableau [jj, mm, aa]
                                // Conversion en objets Date pour calcul (année 20xx)
                                const dStart = new Date(2000 + parseInt(startParts[2]), parseInt(startParts[1]) - 1, parseInt(startParts[0])); // Crée objet Date début (mois commence à 0 en JS)
                                const dEnd = new Date(2000 + parseInt(endParts[2]), parseInt(endParts[1]) - 1, parseInt(endParts[0])); // Crée objet Date fin
                                // Durée en jours
                                const diffTime = Math.abs(dEnd - dStart); // Calcule la différence en millisecondes
                                const durationDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1; // Convertit en jours et ajoute 1 pour inclure le jour de départ
                                // Assurez-vous que trip.duration existe bien dans l'objet sauvegardé
                                const duration = trip.duration || 0;
                                updateLodgingCounter(tripId, duration);
                                const tricountInput = document.getElementById('tricount-url');
                                    if (tricountInput && trip) {
                                        tricountInput.value = trip.tricountUrl || ''; // Force la valeur unique
                                    }
                                updateFinanceScreen(trip.budget, trip.expenses, trip.tricountUrl);

                                // Variables Budget
                                const expenses = trip.expenses || 0; // Récupère les dépenses ou 0 si inexistant
                                const budget = trip.budget || 0; // Récupère le budget ou 0 si inexistant
                                const tricountUrl = trip.tricountUrl || 0; // Récupère le tricount ou 0 si inexistant //Ajout 4
                                
                                // Calcul Pourcentage
                                let percentDisplay = "%"; // Valeur par défaut si calcul impossible
                                let percentColor = "black"; // Couleur par défaut (noir)
                                
                                if (budget > 0 && expenses >= 0) { // Vérifie que le budget est positif et les dépenses valides
                                    const ratio = expenses / budget; // Calcule le ratio dépenses/budget
                                    const percentVal = Math.round(ratio * 100); // Convertit le ratio en pourcentage entier
                                    percentDisplay = percentVal + "%"; // Formate l'affichage avec le symbole %
                                    percentColor = (ratio < 1) ? "#006400" : "#8B0000"; // Vert foncé si <100%, Rouge foncé si >100%
                                }

                                // Variable Logements
                                    // Initialiser le texte avec une valeur par défaut (évite l'erreur de variable manquante)
                                    const fieldLogements = document.getElementById('field-lodgings');
                                    //fieldLogements.innerText = `Logements : ... / ${trip.duration}`;

                                    // Lancer la mise à jour réelle
                                    updateLodgingCounter(tripId, trip.duration); //MàJ de la durée
                                    updateFinanceScreen(budget, expenses, tricountUrl); //MàJ éléments financiers //Ajout 5

                        // =========================
                        // c. Remplissage des champs
                        // =========================
                            // Champ 1 : Durée & Lieu
                            document.getElementById('field-duration-place').innerText = `${trip.duration} jours - ${trip.country} ${trip.flag || ''}`; // Affiche "X jours - Pays Drapeau"

                            // Champ 2 : Dates

                    }

                        // =======================

                                            window.location.href = url;

                                // Éléments de l'écran d'accueil (pour la mise à jour croisée finance)

                                const expensesInput = document.getElementById('finance-expenses-input');

                                const valTricountUrl = document.getElementById('val-tricount-url');

                                // Fonction de sauvegarde
                                let saveFinanceTimeoutHandle = null;
                                function saveFinanceData(budget, expenses, tricountUrl) {
                                    if (typeof currentTripId === 'undefined') return; // Sécurité si aucun voyage ouvert

                                    const tripIndex = cloudTrips.findIndex(t => t.id == currentTripId); // Utilise == pour tolérer string/number

                                if (budgetInput) budgetInput.addEventListener('input', updateAllDisplays);
                                if (expensesInput) expensesInput.addEventListener('input', updateAllDisplays);
                                if (tricountInput) tricountInput.addEventListener('input', updateAllDisplays);

                                const btnRecap = document.querySelector('.btn-recap');
                                if (btnRecap) {
                                    btnRecap.addEventListener('click', () => {
                                        if (currentTripId) {
                                            openRecapScreen(currentTripId);
                                        } else {
                                            alert("Aucun voyage sélectionné.");
                                        }
                                    });
                                }
                                function openRecapScreen(tripId) {
                                    const trip = cloudTrips.find(t => t.id === tripId);
                                    
                                    if (!trip) return;

                                    const recapScreen = document.getElementById('recap-trip-screen');
                                    if (recapScreen) {
                                        // Force l'affichage Flex pour que le header et le contenu s'empilent
                                        recapScreen.style.display = 'flex'; 
                                        recapScreen.classList.add('active');
                                    }
                                    const stackContainer = document.getElementById('recap-days-stack');
                                    
                                    // 1. Vider le conteneur avant de remplir
                                    stackContainer.innerHTML = '';

                                    // 2. Boucle sur tous les jours du voyage (de 1 à trip.duration)
                                    for (let day = 1; day <= trip.duration; day++) {
                                        
                                        // A. Récupérer l'écran original du jour (s'il existe dans le DOM)
                                        // Ou le générer dynamiquement si l'utilisateur ne l'a jamais ouvert
                                        let originalDayScreen = document.getElementById(`screen-${tripId}-${day}`);
                                        
                                        if (!originalDayScreen) {
                                            // Si l'écran n'a jamais été ouvert, on le crée temporairement en mémoire
                                            // (Réutilise votre logique de génération si nécessaire, simplifiée ici)
                                            originalDayScreen = generateDayScreenTemplate(tripId, day, trip.name, trip.duration);
                                        }

                                        // B. Cloner l'écran (true pour copier les enfants, mais PAS les écouteurs d'événements)
                                        // Note: cloneNode(true) ne copie pas les écouteurs addEventListener.
                                        // Pour un récapitulatif en lecture seule, c'est souvent suffisant.
                                        // Si vous avez besoin des interactions (inputs), il faudra réattacher les écouteurs ou utiliser une logique de rendu de données.
                                        const dayClone = originalDayScreen.cloneNode(true);

                                        // C. Nettoyage du clone pour l'adapter au mode "Récap"
                                        dayClone.id = `recap-day-${day}`; // ID unique pour éviter les conflits
                                        dayClone.style.display = 'block'; // S'assurer qu'il est visible
                                        
                                        // Supprimer les classes de navigation ou boutons inutiles via JS si le CSS ne suffit pas
                                        const navButtons = dayClone.querySelector('.nav-buttons');
                                        if (navButtons) navButtons.remove();
                                        
                                        const backBtn = dayClone.querySelector('.btn-back');
                                        if (backBtn) backBtn.remove();

                                        // D. Ajouter au conteneur
                                        stackContainer.appendChild(dayClone);

                                        // E. Ajuster la hauteur de chaque textarea à son contenu réel
                                        // (scrollHeight n'est fiable qu'une fois l'élément dans le DOM visible)
                                        dayClone.querySelectorAll('.day-textarea').forEach(ta => {
                                            ta.style.height = 'auto';
                                            ta.style.height = `${ta.scrollHeight}px`;
                                        });
                                    }

                                    // 3. Afficher l'écran de récap
                                    recapScreen.style.display = 'flex'; // Ou removeAttribute('style') + class 'active'
                                    recapScreen.classList.add('active');
                                }

                                // Fonction utilitaire pour générer un template de jour si inexistant
                                // Reprend exactement la structure HTML de openDayOrgaScreen et la
                                // pré-remplit avec les données déjà sauvegardées (getTripData), pour
                                // que le récap soit toujours complet même si l'utilisateur n'a jamais
                                // ouvert ce jour individuellement.
                                function generateDayScreenTemplate(tripId, dayId, tripName, duration) {
                                    const div = document.createElement('div');
                                    div.id = `screen-${tripId}-${dayId}`;
                                    div.className = 'day-detail-screen';

                                    // Données déjà enregistrées pour ce jour (objet vide si jamais ouvert)
                                    const savedData = getTripData(tripId)[dayId] || {};
                                    const val = (name) => savedData[name] || '';
                                    const isSelected = (name, optionValue) => savedData[name] === optionValue ? 'selected' : '';

                                    div.innerHTML = `
                                        <div class="day-detail-header">
                                            <h2 class="day-detail-title">${tripName} - Jour ${dayId}</h2>
                                        </div>
                                        <div class="day-detail-content">
                                            <div class="input-group travel-block" data-day="${dayId}">
                                                <input type="text" placeholder="Lieu de départ" class="day-input" name="start_location" value="${val('start_location')}">
                                                <input type="text" placeholder="Lieu d'arrivée" class="day-input" name="end_location" value="${val('end_location')}">
                                                <input type="text" placeholder="Itinéraire" class="day-input" name="route" value="${val('route')}">
                                                <select class="day-input" name="transport_type">
                                                    <option value="" disabled ${!savedData.transport_type ? 'selected' : ''}>Moyen de transport</option>
                                                    <option value="voiture" ${isSelected('transport_type', 'voiture')}>Voiture</option>
                                                    <option value="train" ${isSelected('transport_type', 'train')}>Train</option>
                                                    <option value="avion" ${isSelected('transport_type', 'avion')}>Avion</option>
                                                    <option value="bus" ${isSelected('transport_type', 'bus')}>Bus</option>
                                                    <option value="marche" ${isSelected('transport_type', 'marche')}>Marche</option>
                                                </select>
                                            </div>

                                            <div class="input-group lodging-block" data-day="${dayId}">
                                                <input type="text" placeholder="Nom du logement" class="day-input" name="lodging_name" value="${val('lodging_name')}">
                                                <input type="time" class="day-input" name="arrival_time" value="${val('arrival_time')}">
                                            </div>

                                            <div class="activities-block" data-day="${dayId}">
                                                <textarea placeholder="Activités, notes, idées..." class="day-textarea" name="activities">${val('activities')}</textarea>
                                            </div>
                                        </div>
                                    `;
                                    return div;
                                }
                // ==========================================================
                // 02. FONCTION DE FERMETURE DE L'ECRAN D'ACCUEIL DES VOYAGES
                // ==========================================================
                    function closeTripHome() {
                        document.getElementById('trip-home-screen').classList.remove('active'); // Retire la classe 'active' pour cacher l'écran
                        currentTripId = null; // Réinitialise l'ID du voyage en cours
                    }

                // ==========================================
                // 03. FONCTION DE FERMETURE DE L'ECRAN RECAP
                // ==========================================
                    function closeRecap() {
                        const recapScreen = document.getElementById('recap-trip-screen');
                        const stackContainer = document.getElementById('recap-days-stack');

                        if (recapScreen) {
                            // 1. Masquer l'écran
                            recapScreen.classList.remove('active');
                            recapScreen.style.display = 'none';

                            // 2. Vider le conteneur (Optionnel mais recommandé pour la performance)
                            // Cela évite de garder en mémoire tous les clones des jours précédents
                            if (stackContainer) {
                                stackContainer.innerHTML = '';
                            }
                        }
                    }

            // ==================================================
            // FONCTIONS DE L'ECRAN DE PLANIFICATIONS DES VOYAGES
            // ==================================================
                // ===============================================================
                // 01. Fonctions pour ouvrir et compléter l'écran de planification
                // ===============================================================
                    // Fonction principale pour ouvrir l'écran de planification (day-home-screen)
                    function openDayHome(tripId) { // Définit la fonction recevant l'ID unique du voyage choisi
                        // 1. Récupération des données du voyage depuis le DOM (Dashboard ou Liste)
                        const sourceCard = document.querySelector(`.trip-card[data-trip-id="${tripId}"]`); // Sélectionne la carte HTML correspondant à l'ID du voyage
                        if (!sourceCard) { console.error("Voyage introuvable pour l'ID :", tripId); return; } // Arrête si la carte n'existe pas

                        // 2. Extraction de la durée et du nom
                        const duration = parseInt(sourceCard.dataset.diffTime); // Lit la valeur dynamique 'diffTime' stockée dans l'attribut data
                        const tripName = document.getElementById('trip-home-title')?.textContent || "Voyage"; // Récupère le nom du voyage courant affiché dans l'écran trip-home-screen

                        // 3. Préparation de l'écran de planification
                        const screen = document.getElementById('day-home-screen'); // Cible le conteneur principal de l'écran
                        const grid = screen.querySelector('.day-home-grid'); // Cible la grille interne où les boutons seront placés
                        const title = document.getElementById('day-home-title'); // Cible l'élément du titre

                        if (!grid) { console.error("Grille .day-home-grid introuvable dans le HTML"); return; } // Vérifie la présence de la grille

                        grid.innerHTML = ''; // Vide la grille pour éviter les doublons si on réouvre l'écran
                        if (title) title.textContent = `Planification`; // Met à jour le titre avec le nom du voyage choisi

                        // 4. Génération dynamique des boutons "Jour" (btn-day)
                        if (duration > 0) { // Vérifie que la durée est valide
                            for (let i = 1; i <= duration; i++) { // Boucle de 1 jusqu'au nombre de jours (diffTime)
                                const btn = document.createElement('button'); // Crée un nouvel élément bouton dans la mémoire
                                btn.className = 'btn-day'; // Applique la classe CSS pour le design uniforme
                                btn.textContent = `Jour ${i}`; // Définit le texte affiché sur le bouton
                                
                                // Attribution de données uniques pour l'indépendance de chaque bouton
                                btn.dataset.dayId = i; // Stocke le numéro du jour (1, 2, 3...)
                                btn.dataset.tripId = tripId; // Associe le bouton à l'ID du voyage parent

                                // Gestion du clic spécifique pour chaque bouton
                                btn.addEventListener('click', (e) => { // Ajoute un écouteur d'événement au clic
                                    e.stopPropagation(); // Empêche le clic de remonter aux éléments parents
                                    openDayOrgaScreen(tripId, i, tripName, duration); // Appelle la fonction pour ouvrir l'écran UNIQUE à ce jour précis
                                });

                                grid.appendChild(btn); // Ajoute physiquement le bouton à la grille de l'écran
                            }
                        } else {
                            grid.innerHTML = '<p>Durée invalide</p>'; // Affiche un message si la durée est 0 ou erreur
                        }

                        // 5. Affichage final de l'écran
                        screen.classList.add('active'); // Ajoute la classe CSS qui rend l'écran visible
                        screen.style.display = 'flex'; // Force l'affichage en mode Flexbox par sécurité
                    }

                // =====================================================
                // 02. Fonction de fermeture de l'écran de planification
                // =====================================================
                    // Fonction JavaScript requise pour fermer l'écran
                    function closeDayHome() { /* Logique pour masquer ou supprimer le day-home-screen */
                        const screen = document.getElementById('day-home-screen'); /* Sélectionne l'élément à fermer */
                        if (screen) screen.style.display = 'none'; /* Masque l'élément en changeant son style CSS */
                    }

            // ======================================
            // FONCTIONS DE L'ECRAN DU JOUR DU VOYAGE
            // ======================================
                // Fonction pour ouvrir l'écran d'organisation spécifique à un jour (Jour N)
                function openDayOrgaScreen(tripId, dayId, tripName, maxDays) { // Définit la fonction recevant l'ID voyage et le Jour
                    // Création d'un ID unique pour l'écran de ce jour précis (ex: screen-123-5)
                    const screenId = `screen-${tripId}-${dayId}`; 
                    let screen = document.getElementById(screenId); // Tente de trouver un écran déjà existant pour ce jour

                    // Si l'écran n'existe pas encore, on le crée dynamiquement (Indépendance totale)
                    if (!screen) {
                        screen = document.createElement('div');
                        screen.id = screenId;
                        screen.className = 'day-detail-screen';

                        // Injection du HTML UNIQUEMENT à la création
                        screen.innerHTML = `
                            <div class="day-detail-header">
                                <button class="btn-back" data-action="back">&larr;</button>
                                <h2 class="day-detail-title">${tripName} - Jour ${dayId}</h2>
                            </div>
                            <div class="day-detail-content">
                                <!-- Ajout de data-day-id pour faciliter la récupération des données plus tard -->
                                <div class="input-group travel-block" data-day="${dayId}">
                                    <input type="text" placeholder="Lieu de départ" class="day-input" name="start_location">
                                    <input type="text" placeholder="Lieu d'arrivée" class="day-input" name="end_location">
                                    <input type="text" placeholder="Itinéraire" class="day-input" name="route">
                                    <select class="day-input" name="transport_type">
                                        <option value="" disabled selected>Moyen de transport</option>
                                        <option value="voiture">Voiture</option>
                                        <option value="train">Train</option>
                                        <option value="avion">Avion</option>
                                        <option value="bus">Bus</option>
                                        <option value="marche">Marche</option>
                                    </select>
                                </div>
                                
                                <div class="input-group lodging-block" data-day="${dayId}">
                                    <input type="text" placeholder="Nom du logement" class="day-input" name="lodging_name">
                                    <input type="time" class="day-input" name="arrival_time"> 
                                    <!-- Note: type="time" n'accepte pas l'attribut placeholder dans tous les navigateurs -->
                                </div>

                                <div class="activities-block" data-day="${dayId}">
                                    <textarea placeholder="Activités, notes, idées..." class="day-textarea" name="activities"></textarea>
                                </div>

                                <div class="nav-buttons">
                                    <!-- Utilisation de classes au lieu d'IDs uniques pour la navigation -->
                                    <!-- Classe 'btn-prev' requise -->
                                    <button class="btn-nav btn-prev">&larr; Jour Préc.</button>
                                    
                                    <!-- Classe 'btn-next' requise -->
                                    <button class="btn-nav btn-next">Jour Suiv. &rarr;</button>
                                </div>
                            </div>
                        `;
                        document.body.appendChild(screen);

                        // --- DEBUT DU BLOC : Attacher les écouteurs de sauvegarde ---
                        // 1. Sélection de tous les champs
                        const inputs = screen.querySelectorAll('input, select, textarea');

                        // 2. Fonction de collecte (Définie UNE SEULE FOIS)
                        function collectAndSave() {
                            const formData = {};
                            let hasData = false;
                            
                            screen.querySelectorAll('input, select, textarea').forEach(el => {
                                if (el.name) {
                                    formData[el.name] = el.value;
                                    if (el.value.trim() !== '') hasData = true;
                                }
                            });

                            if (hasData || Object.keys(formData).length > 0) {
                                saveDayData(tripId, dayId, formData);
                            }
                        }

                        // 3. Attache des écouteurs (UNE SEULE FOIS)
                        inputs.forEach(input => {
                            input.addEventListener('input', collectAndSave);
                            if (input.tagName === 'SELECT') {
                                input.addEventListener('change', collectAndSave);
                            }
                        });

                        // 4. Chargement des données (Restauration)
                        const savedData = getTripData(tripId)[dayId];
                        if (savedData) {
                            inputs.forEach(el => {
                                if (el.name && savedData[el.name] !== undefined) {
                                    el.value = savedData[el.name];
                                }
                            });
                        }
                        
                        // --- FIN DU BLOC ÉCOUTEURS POUR LES SAUVEGARDES ---
                        
                        // Ecouteurs d'événements pour les boutons de cet écran spécifique
                        // En utilisant la délégation d'événement ou en ciblant 'screen.querySelector'
                        screen.querySelector('.btn-back').addEventListener('click', () => { /* logique retour */ });
                        screen.querySelector('.btn-prev').addEventListener('click', () => { /* logique jour précédent */ });
                        screen.querySelector('.btn-next').addEventListener('click', () => { /* logique jour suivant */ });

                    } else {
                        // L'écran existe déjà : on ne fait rien, on conserve les données saisies précédemment
                    }

                    // Logique d'affichage
                    screen.style.display = ''; // 1. EFFACE le style inline 'none' laissé par la fermeture
                    screen.classList.add('active'); // 2. Ajoute la classe 'active' pour afficher (géré par CSS)

                        // --- GESTION NAVIGATION ---
                        screen.addEventListener('click', (e) => {
                            const target = e.target;

                            // Cas : Bouton Jour Précédent
                            const btnPrev = target.closest('.btn-prev');
                            if (btnPrev) {
                                e.preventDefault();
                                // Si on n'est pas au premier jour, on navigue. Sinon, on ne fait rien (silencieux).
                                if (dayId > 1) {
                                    screen.style.display = 'none'; // 1. Force le masquage inline
                                    screen.classList.remove('active'); // 2. Retire la classe active
                                    openDayOrgaScreen(tripId, dayId - 1, tripName, maxDays);
                                }
                                return;
                            }

                            // Cas : Bouton Jour Suivant
                            const btnNext = target.closest('.btn-next');
                            if (btnNext) {
                                e.preventDefault();
                                // Si on n'est pas au dernier jour, on navigue. Sinon, on ne fait rien (silencieux).
                                if (dayId < maxDays) {
                                    screen.style.display = 'none'; // 1. Force le masquage inline
                                    screen.classList.remove('active'); // 2. Retire la classe active
                                    openDayOrgaScreen(tripId, dayId + 1, tripName, maxDays);
                                }
                                return;
                            }

                            // Cas : Bouton Retour
                            const btnBack = target.closest('.btn-back');
                            if (btnBack) {
                                e.preventDefault();
                                screen.style.display = 'none'; // 1. Force le masquage inline
                                screen.classList.remove('active'); // 2. Retire la classe active
                                return;
                            }
                        });



                    }





                




        </script> <!-- Ferme le bloc JavaScript -->
</body> <!-- Ferme le corps de la page -->
